services:
#----------------------------------
# Database service configuration
#----------------------------------
  db:
    image: mysql:8.0
    container_name: systeme_parquet_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - systeme_parquet_network
#---------------------------------
# phpMyAdmin service configuration
#---------------------------------

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: systeme_parquet_phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI}
    ports:
      - "8081:80"
    networks:
      - systeme_parquet_network
#---------------------------------
# MINIO service de storage configuration
#---------------------------------
  minio:
    image: minio/minio
    container_name: systeme_parquet_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9000"   # API S3
      - "9002:9001"   # Console web MinIO
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - systeme_parquet_network

volumes:
  db_data:
  minio_data:

networks:
  systeme_parquet_network:
    driver: bridge
